<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor WebAR — Canales RGB y Escena 3D</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <div style="position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10; background: rgba(15,23,42,0.88); color: #fff; padding: 10px 14px; border-radius: 10px; font-family: sans-serif; font-size: 14px;">
    <strong>Experiencia WebAR (AR.js):</strong> Apunta la cámara al marcador <em>Hiro</em> para visualizar los canales RGB en 3D.
    <a href="../../index.html" style="color: #38bdf8; margin-left: 8px;">Volver al E-Book</a>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-box position="-0.6 0.4 0" scale="0.45 0.45 0.45" color="#ef4444"></a-box>
      <a-box position="0 0.7 0" scale="0.45 0.45 0.45" color="#22c55e"></a-box>
      <a-box position="0.6 0.4 0" scale="0.45 0.45 0.45" color="#3b82f6"></a-box>
      <a-text value="Canales RGB" position="-0.55 1.25 0" color="#ffffff" scale="0.8 0.8 0.8"></a-text>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
